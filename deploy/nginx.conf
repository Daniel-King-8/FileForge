upstream fileforge_app {
    server app:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 210m;
    client_body_timeout 300s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # 静态资源直接从项目目录读取，不经过 Python
    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 下载加速：后端返回 X-Accel-Redirect: /_files/<uuid>，Nginx 从 results 卷发文件
    location /_files/ {
        internal;
        alias /srv/results/;
        # 保留 Flask 设置的 Content-Type / Content-Disposition / Cache-Control
        add_header X-Accel-Served "nginx" always;
    }

    # SSE 进度流：关闭缓冲，长连接
    location ~ ^/api/tasks/[^/]+/stream$ {
        proxy_pass http://fileforge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://fileforge_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
