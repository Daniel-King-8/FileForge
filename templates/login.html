{% extends "base.html" %}
{% block title %}登录 · FileForge{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card panel">
    <div class="auth-head">
      <span class="brand-mark">F</span>
      <h1>登录 FileForge</h1>
      <p>登录后即可上传文件、管理任务与分享结果</p>
    </div>
    <form id="login-form" class="form" data-next="{{ next }}">
      <label class="field">
        <span>用户名或邮箱</span>
        <input name="username" autocomplete="username" required autofocus placeholder="username">
      </label>
      <label class="field">
        <span>密码</span>
        <input name="password" type="password" autocomplete="current-password" required placeholder="••••••••">
      </label>
      <p class="form-error" id="form-error" hidden></p>
      <button class="btn btn-primary btn-block" type="submit">登录</button>
    </form>
    <p class="auth-foot">还没有账号？<a href="/register">立即注册</a></p>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/auth.js') }}"></script>{% endblock %}
